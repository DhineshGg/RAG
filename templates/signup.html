<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vespera · Create Account</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body class="auth-body">

<div class="auth-shell">

  <!-- Brand panel -->
  <div class="auth-brand">
    <div class="brand-logo-lg">
      <div class="brand-icon-lg">✦</div>
      <h1 class="brand-name-lg">Vespera</h1>
    </div>

    <p class="brand-tagline">Your cosmic intelligence workspace.<br/>Upload, retrieve, and reveal hidden insights.</p>

    <div class="brand-canvas-wrap">
      <canvas id="authCanvas" width="400" height="185"></canvas>
    </div>

    <div class="brand-features">
      <div class="feat-row">
        <span class="feat-dot" style="background:#7c6cff"></span>
        PDF, TXT, CSV, XLSX ingestion
      </div>
      <div class="feat-row">
        <span class="feat-dot" style="background:#36d6c9"></span>
        Semantic + keyword retrieval
      </div>
      <div class="feat-row">
        <span class="feat-dot" style="background:#a78bfa"></span>
        Grounded answers with citations
      </div>
    </div>
  </div>

  <!-- Auth card -->
  <div class="auth-card">

    <h2 class="auth-title">Create account</h2>
    <p class="auth-sub">Start uncovering what your data hides</p>

    <div id="signupError" class="auth-alert error" style="display:none"></div>

    <form action="/signup" method="POST">
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">First Name</label>
          <input class="field-input" type="text" name="name" placeholder="Alex" autocomplete="given-name" required/>
        </div>
        <div class="field-group">
          <label class="field-label">Surname</label>
          <input class="field-input" type="text" name="surname" placeholder="Jordan" autocomplete="family-name" required/>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Email address</label>
        <input class="field-input" type="email" name="email" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8"/>
      </div>
      <button class="auth-btn" type="submit">Create Account →</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>

  </div>

</div>

<script>
  const errMap = { exists: 'An account with this email already exists.', short_password: 'Password must be at least 8 characters.' };
  const key = new URLSearchParams(location.search).get('error');
  if (key && errMap[key]) {
    const el = document.getElementById('signupError');
    el.textContent = errMap[key]; el.style.display = 'block';
  }

  (function() {
    const canvas = document.getElementById('authCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = 400, H = canvas.height = 185;
    const COLORS = ['#7c6cff','#36d6c9','#a78bfa'];
    const nodes = Array.from({length: 30}, (_, i) => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: 1.5+Math.random()*2, color: COLORS[i%3],
      phase: Math.random()*Math.PI*2,
    }));

    function hex2rgba(hex, a) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a.toFixed(3)})`;
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      nodes.forEach(n => {
        n.x+=n.vx; n.y+=n.vy;
        if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1;
        n.phase+=0.018;
      });
      for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++) {
        const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
        if(d>80) continue;
        const a=(1-d/80)*0.28;
        const g=ctx.createLinearGradient(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y);
        g.addColorStop(0,hex2rgba(nodes[i].color,a)); g.addColorStop(1,hex2rgba(nodes[j].color,a));
        ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=g; ctx.lineWidth=0.7; ctx.stroke();
      }
      nodes.forEach(n => {
        const pulse=0.5+0.5*Math.sin(n.phase);
        const grd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*3);
        grd.addColorStop(0,hex2rgba(n.color,0.3*pulse)); grd.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r*3,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r*(0.8+0.2*pulse),0,Math.PI*2);
        ctx.fillStyle=hex2rgba(n.color,0.75+0.25*pulse); ctx.fill();
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r*0.35,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>

</body>
</html>
